  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff59b"/><stop offset="1" stop-color="#ff9d20"/></linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="15"/></filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#a8eaff" stroke-opacity=".12" stroke-width="2"/></pattern>
</defs>
