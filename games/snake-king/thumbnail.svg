<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071b35"/><stop offset=".48" stop-color="#123e65"/><stop offset="1" stop-color="#27104d"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#55ffbd" stop-opacity=".42"/><stop offset="1" stop-color="#55ffbd" stop-opacity="0"/></radialGradient>
  <linearGradient id="snake" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#baff38"/><stop offset=".28" stop-color="#21e6a0"/><stop offset=".56" stop-color="#20c8ff"/><stop offset=".78" stop-color="#9a55ff"/><stop offset="1" stop-color="#ff55c8"/></linearGradient>
