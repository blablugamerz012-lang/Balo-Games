<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10143d"/><stop offset=".55" stop-color="#34206d"/><stop offset="1" stop-color="#101b4b"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#8a5cff" stop-opacity=".65"/><stop offset="1" stop-color="#8a5cff" stop-opacity="0"/></radialGradient>
  <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#fff2a6"/><stop offset=".48" stop-color="#ffc83d"/><stop offset="1" stop-color="#d98712"/></linearGradient>
  <linearGradient id="blue" x2="0" y2="1"><stop stop-color="#8beaff"/><stop offset="1" stop-color="#2878ed"/></linearGradient>
  <linearGradient id="red" x2="0" y2="1"><stop stop-color="#ff9b9b"/><stop offset="1" stop-color="#e53d69"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="16"/><feOffset dy="15"/><feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shine"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<rect width="1280" height="720" fill="url(#bg)"/>
<circle cx="650" cy="365" r="440" fill="url(#glow)"/>
