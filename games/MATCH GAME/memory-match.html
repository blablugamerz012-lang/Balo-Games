<style>

#hCb:empty{display:none}#hCb{color:#ffe566;border-color:#ffe566;background:linear-gradient(135deg,rgba(255,220,80,.4),rgba(255,160,40,.25));text-shadow:0 0 10px #ffe566;animation:comboPulse 0.8s infinite alternate}

.hud-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}

#hb,#pk{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font:inherit;border:0;border-radius:16px;min-height:48px;padding:8px 12px;color:#1a1000;font-weight:800;cursor:pointer;transition:transform .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent}
#hb{background:linear-gradient(135deg,#ffe566,#fbbf24);box-shadow:0 5px 16px rgba(251,191,36,.45)}

#hb:active,#pk:active,#pb:active{transform:scale(.95)}

#hFv{display:none;background:linear-gradient(135deg,#ff6b35,#f7c948)!important;border-color:#ffe566;color:#1a0a00;animation:feverPulse .5s infinite alternate;font-weight:900}
@keyframes feverPulse{to{transform:scale(1.08);box-shadow:0 0 20px rgba(255,150,50,.7)}}
@media(max-width:400px){.hud-powers{gap:6px}#hb,#pk{min-height:44px;padding:6px 8px;border-radius:14px}.pow-ico{font-size:18px}.pow-txt{font-size:11px}#pb{width:44px;height:44px}}
body.fever #stage{animation:feverGlow 1s ease-in-out infinite alternate}
@keyframes feverGlow{to{filter:drop-shadow(0 0 12px rgba(255,180,50,.4))}}
.card.deal{opacity:0;transform:scale(.5) translateY(-30px);animation:dealIn .4s ease forwards}
@keyframes dealIn{to{opacity:1;transform:scale(1) translateY(0)}}
.card.hint-glow .f{box-shadow:0 0 24px 8px rgba(251,191,36,.8)!important;border-color:#fbbf24}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px}
#board{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--g)}
.card{position:relative;width:var(--cw);height:calc(var(--cw)/.75);perspective:1100px;cursor:pointer;transition:transform .18s ease;will-change:transform}
.card:hover{transform:translateY(-3px)}
.card:active{transform:scale(.95)}
.in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .48s cubic-bezier(.34,1.45,.64,1)}
.card.up .in{transform:rotateY(180deg)}
.f,.b{position:absolute;inset:0;border-radius:calc(var(--cw)*.15);-webkit-backface-visibility:hidden;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(0,0,0,.45)}
.b{background:repeating-linear-gradient(45deg,rgba(255,255,255,.14) 0 7px,transparent 7px 14px),linear-gradient(145deg,var(--ba),var(--bb));border:2.5px solid rgba(255,255,255,.75)}
.b::before{content:"";position:absolute;inset:5px;border:2px solid rgba(255,255,255,.4);border-radius:calc(var(--cw)*.11)}
.b::after{content:"✦";font-size:calc(var(--cw)*.38);color:rgba(255,255,255,.8);text-shadow:0 0 14px rgba(255,255,255,.6)}
.f{transform:rotateY(180deg);background:linear-gradient(160deg,#ffffff,#fff5f8);font-size:calc(var(--cw)*.54);border:2.5px solid #fff;box-shadow:inset 0 0 24px rgba(255,180,220,.3)}
.f .emo{display:inline-block;transform-origin:center center;will-change:transform}
.card.up .f .emo{animation:emojiIn .45s cubic-bezier(.34,1.7,.64,1) both}
.card.match .f{background:linear-gradient(160deg,#fff,#d4ffea);box-shadow:0 0 32px 10px rgba(80,255,180,.75),0 0 14px 3px #7dffb8;animation:pop .55s cubic-bezier(.34,1.6,.64,1)}
/* Personality loops – only the emoji moves, card stays still */
.card.match .f .emo.p-wiggle{animation:pWiggle 1.1s ease-in-out .35s infinite}
.card.match .f .emo.p-bounce{animation:pBounce .9s ease-in-out .35s infinite}
.card.match .f .emo.p-roar{animation:pRoar 1.35s ease-in-out .3s infinite}
.card.match .f .emo.p-nibble{animation:pNibble 1s ease-in-out .35s infinite}
.card.match .f .emo.p-spin{animation:pSpin 1.4s ease-in-out .35s infinite}
.card.match .f .emo.p-pulse{animation:pPulse 1.1s ease-in-out .35s infinite}
.card.match .f .emo.p-hop{animation:pHop .85s ease-in-out .35s infinite}
@keyframes emojiIn{0%{transform:scale(.15) rotate(-20deg)}50%{transform:scale(1.3) rotate(12deg)}75%{transform:scale(.88) rotate(-6deg)}100%{transform:scale(1) rotate(0)}}
@keyframes pWiggle{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-14deg) scale(1.1)}50%{transform:rotate(14deg) scale(1.08)}75%{transform:rotate(-8deg) scale(1.06)}}
@keyframes pBounce{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-10px) scale(1.15,0.9)}50%{transform:translateY(0) scale(0.95,1.1)}70%{transform:translateY(-5px) scale(1.08)}}
/* Lion roar – big open + shake like dahan khol ke daharna */
@keyframes pRoar{
  0%,100%{transform:scale(1,1) rotate(0)}
  12%{transform:scale(1.15,0.9) rotate(-4deg)}
  28%{transform:scale(1.4,1.35) rotate(5deg)}
  40%{transform:scale(1.5,1.45) rotate(-7deg)}
  52%{transform:scale(1.35,1.3) rotate(6deg)}
  65%{transform:scale(1.45,1.4) rotate(-4deg)}
  80%{transform:scale(1.2,1.15) rotate(3deg)}
}
@keyframes pNibble{0%,100%{transform:scale(1) rotate(0)}15%{transform:scale(1.05) rotate(-8deg) translateY(2px)}30%{transform:scale(0.92) rotate(5deg)}50%{transform:scale(1.12) rotate(-5deg) translateY(-3px)}70%{transform:scale(0.95) rotate(6deg)}}
@keyframes pSpin{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(15deg) scale(1.1)}50%{transform:rotate(-15deg) scale(1.15)}75%{transform:rotate(10deg) scale(1.08)}}
@keyframes pPulse{0%,100%{transform:scale(1)}30%{transform:scale(1.22)}60%{transform:scale(0.92)}80%{transform:scale(1.1)}}
@keyframes pHop{0%,100%{transform:translateY(0) rotate(0) scale(1)}25%{transform:translateY(-12px) rotate(-8deg) scale(1.1)}50%{transform:translateY(0) rotate(0) scale(1)}75%{transform:translateY(-7px) rotate(8deg) scale(1.08)}}
@keyframes pop{0%{transform:rotateY(180deg) scale(1)}35%{transform:rotateY(180deg) scale(1.18)}65%{transform:rotateY(180deg) scale(.95)}100%{transform:rotateY(180deg) scale(1)}}
.card.shake .in{animation:shk .48s .38s}
@keyframes shk{0%,100%{transform:rotateY(180deg)}20%{transform:rotateY(180deg) translateX(-9px) rotate(-5deg)}40%{transform:rotateY(180deg) translateX(9px) rotate(5deg)}60%{transform:rotateY(180deg) translateX(-6px)}80%{transform:rotateY(180deg) translateX(6px)}}
.pt{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;pointer-events:none;animation:pt .7s forwards;z-index:3;box-shadow:0 0 6px currentColor}
@keyframes pt{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.sf{position:absolute;left:0;right:0;top:18%;text-align:center;font-weight:900;font-size:1.15em;color:#fff;text-shadow:0 2px 6px #000,0 0 12px #ff9;pointer-events:none;animation:sf .9s forwards;z-index:3}
@keyframes sf{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-50px) scale(1.2);opacity:0}}
.noanim .in{transition-duration:.01s}.noanim .card.up .f .emo,.noanim .card.match .f,.noanim .card.match .f .emo,.noanim .card.shake .in{animation:none!important}
.float-msg{position:fixed;left:50%;top:28%;transform:translateX(-50%);z-index:30;font-weight:900;font-size:22px;letter-spacing:1px;text-shadow:0 3px 12px #000,0 0 20px currentColor;pointer-events:none;animation:floatUp 1.4s ease-out forwards;white-space:nowrap}
@keyframes floatUp{0%{opacity:0;transform:translateX(-50%) translateY(20px) scale(.8)}15%{opacity:1;transform:translateX(-50%) translateY(0) scale(1.1)}70%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-40px) scale(1)}}

function unlockAudio(){

 }catch(e){}
 // Warm up all mp3s on first tap (browser unlock)
 Object.values(soundLists).flat().forEach(f=>{
  try{
   const a=getAudio(f);
   a.muted=true;
   const p=a.play();
   if(p&&p.then)p.then(()=>{a.pause();a.currentTime=0;a.muted=false;}).catch(()=>{a.muted=false;});
  }catch(e){}
 });
}
function playRandom(type,vol=0.9){
 if(!S.sound)return;

 if(!list||!list.length)return;
 let file;
 if(list.length===1){file=list[0];}
 else{
  let tries=0;
  do{file=list[Math.random()*list.length|0];tries++;}while(file===lastPlayed[type]&&tries<8);
  lastPlayed[type]=file;
 }
 const a=getAudio(file);
 try{
  a.muted=false;a.volume=vol;
  a.pause();
  try{a.currentTime=0;}catch(e){}
  const p=a.play();

   // retry once after unlock

   setTimeout(()=>{try{a.currentTime=0;a.play().catch(()=>{});}catch(e){}},60);
  });
 }catch(e){}
}

}

  if(state!=='playing'||!G||G.lock||G.done||G.preview)return;
  if(G.hints>=3){floatMsg('Max 3 hints / level','#ff8a8a');return;}
  if(S.coins<100){floatMsg('Need 100 🪙','#ff8a8a');return;}
  const open={};
  for(const c of G.cards){if(!c.matched&&!c.up){if(!open[c.id])open[c.id]=[];open[c.id].push(c);}}
  const ids=Object.keys(open).filter(k=>open[k].length>=2);
  if(!ids.length){floatMsg('No hints left','#aaa');return;}
  const pair=open[ids[Math.random()*ids.length|0]];
  S.coins-=100;G.hints++;save();
  G.lock=true;
  pair[0].el.classList.add('up','hint-glow');pair[1].el.classList.add('up','hint-glow');
  pair[0].up=true;pair[1].up=true;
  floatMsg('💡 HINT! -100🪙','#fbbf24');sfx('match');
  setTimeout(()=>{
   if(!G||G.done)return;
   pair[0].up=false;pair[1].up=false;
   pair[0].el.classList.remove('up','hint-glow');pair[1].el.classList.remove('up','hint-glow');
   G.lock=false;hud();
  },1400);
 },
 peek:()=>{
  if(state!=='playing'||!G||G.lock||G.done||G.preview)return;
  if(G.peeks>=1){floatMsg('Max 1 peek / level','#ff8a8a');return;}
  if(S.coins<500){floatMsg('Need 500 🪙','#ff8a8a');return;}
  S.coins-=500;G.peeks++;save();
  G.lock=true;
  const wasUp=G.cards.map(c=>({up:c.up,matched:c.matched}));
  G.cards.forEach(c=>{if(!c.matched){c.up=true;c.el.classList.add('up','hint-glow');}});
  floatMsg('👁 PEEK 2 SEC! -500🪙','#38bdf8');sfx('match');screenFlash('rgba(56,189,248,.3)');
  setTimeout(()=>{
   if(!G||G.done)return;
   G.cards.forEach((c,i)=>{
    if(!c.matched){c.up=wasUp[i].up;c.el.classList.toggle('up',c.up);c.el.classList.remove('hint-glow');}
   });
   G.lock=false;hud();
  },2000);
 },
 sound:()=>{S.sound=!S.sound;save();renderSet();updateSoundBtn();},music:()=>{S.music=!S.music;save();renderSet();},anim:()=>{S.anim=!S.anim;save();applyTheme();renderSet();},
 buy:b=>{const k=b.dataset.k,i=+b.dataset.i,list=k==='B'?BACKS:BGS,owned=k==='B'?S.oB:S.oG;
  if(!owned.includes(i)){if(S.coins<list[i].p){b.textContent='Not enough 🪙';return;}S.coins-=list[i].p;owned.push(i);}
  if(k==='B')S.sB=i;else S.sG=i;save();applyTheme();renderShop();}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;sfx('click');const f=ACT[b.dataset.a];if(f)f(b);});
$('board').addEventListener('pointerdown',e=>{const c=e.target.closest('.card');if(c){e.preventDefault();pick(+c.dataset.i);}});
addEventListener('keydown',e=>{if(e.key==='Escape'){if(state==='playing')ACT.pause();else if(state==='paused')ACT.resume();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)ACT.pause();});
addEventListener('resize',()=>{layout();layoutHits();});
const homeImg=document.querySelector('.home-img');
if(homeImg){homeImg.addEventListener('load',layoutHits);if(homeImg.complete)layoutHits();}
const bubColors=['#ff6b9d','#a78bfa','#7dd3fc','#ffe566','#4ade80','#fb923c','#f472b6','#67e8f9'];
for(let i=0;i<14;i++){const d=document.createElement('div'),s=24+Math.random()*70,c=bubColors[i%bubColors.length];d.className='bub';d.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;background:${c};box-shadow:0 0 20px ${c};animation-duration:${18+Math.random()*28}s;animation-delay:-${Math.random()*35}s`;document.body.appendChild(d);}
applyTheme();toMenu();
})();
</script>
</body></html>
