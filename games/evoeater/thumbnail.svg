<g opacity=".65" fill="none" stroke="#35dfff" stroke-width="5"><path d="M-30 490 Q180 390 370 470 T760 455 T1240 420"/><path d="M-20 535 Q190 435 390 515 T790 500 T1230 470"/></g>
<text x="62" y="175" font-family="Arial,sans-serif" font-size="112" font-weight="1000" fill="#071b3e" stroke="#071b3e" stroke-width="24" stroke-linejoin="round">EVO</text>
<text x="58" y="172" font-family="Arial,sans-serif" font-size="112" font-weight="1000" fill="url(#gold)" stroke="#fff2a6" stroke-width="5" paint-order="stroke">EVO</text>
<text x="58" y="282" font-family="Arial,sans-serif" font-size="112" font-weight="1000" fill="#071b3e" stroke="#071b3e" stroke-width="24" stroke-linejoin="round">EATER</text>
<text x="58" y="279" font-family="Arial,sans-serif" font-size="112" font-weight="1000" fill="#f7fdff" stroke="#5ccfff" stroke-width="5" paint-order="stroke">EATER</text>
<path d="M65 325 H590" stroke="#8cecff" stroke-width="7" stroke-linecap="round"/>
<text x="70" y="375" font-family="Arial,sans-serif" font-size="31" font-weight="800" letter-spacing="3" fill="#e4fbff">EAT • GROW • EVOLVE</text>
