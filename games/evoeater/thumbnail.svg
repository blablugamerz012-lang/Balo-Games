<!-- final purple/orange creature -->
<g transform="translate(1010 430)" filter="url(#shadow)"><circle r="175" fill="#ffe64a" opacity=".12"/><path d="M-68 -55 Q-150 -160 -180 -80 Q-170 -20 -75 -5 M68 -55 Q150 -160 180 -80 Q170 -20 75 -5" fill="#ff9b25" stroke="#ffe4a4" stroke-width="10"/><path d="M-40 -120 L-65 -195 M40 -120 L65 -195" stroke="#ffd477" stroke-width="13" stroke-linecap="round"/><ellipse cy="92" rx="125" ry="25" fill="#00163b" opacity=".35"/><circle r="128" fill="url(#gold)" stroke="#fff2a6" stroke-width="9"/><use href="#eyes" transform="scale(1.9)"/><path d="M-55 -137 L-42 -180 L-15 -150 L0 -205 L20 -150 L48 -180 L58 -137Z" fill="#ffcf28" stroke="#fff2a6" stroke-width="7" stroke-linejoin="round"/></g>
