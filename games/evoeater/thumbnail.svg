<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#071b55"/><stop offset=".55" stop-color="#0757a6"/><stop offset="1" stop-color="#06b9c8"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#40dcff" stop-opacity="0"/></radialGradient>
 <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#fff68a"/><stop offset=".5" stop-color="#ffc928"/><stop offset="1" stop-color="#f07808"/></linearGradient>
 <linearGradient id="blue" x2="0" y2="1"><stop stop-color="#baf6ff"/><stop offset=".45" stop-color="#36bfff"/><stop offset="1" stop-color="#0759dc"/></linearGradient>
 <linearGradient id="green" x2="0" y2="1"><stop stop-color="#e2ff9a"/><stop offset=".5" stop-color="#75e943"/><stop offset="1" stop-color="#16a64a"/></linearGradient>
 <linearGradient id="red" x2="0" y2="1"><stop stop-color="#ffd1db"/><stop offset=".5" stop-color="#ff6682"/><stop offset="1" stop-color="#d51b55"/></linearGradient>
 <linearGradient id="purple" x2="0" y2="1"><stop stop-color="#f1caff"/><stop offset=".5" stop-color="#b45aff"/><stop offset="1" stop-color="#6523c9"/></linearGradient>
