<g transform="translate(300 535)" filter="url(#shadow)"><path d="M-38 0 Q-100 -70 -91 12 Q-70 50 -38 28 M38 0 Q100 -70 91 12 Q70 50 38 28" fill="#279fff" stroke="#a6edff" stroke-width="6"/><ellipse cy="42" rx="66" ry="15" fill="#00163b" opacity=".35"/><circle r="62" fill="url(#blue)" stroke="#b8f6ff" stroke-width="5"/><use href="#eyes" transform="scale(1.05)"/></g>
