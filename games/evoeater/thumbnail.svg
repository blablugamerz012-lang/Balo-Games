<g transform="translate(120 550)" filter="url(#shadow)"><ellipse cy="40" rx="55" ry="13" fill="#00163b" opacity=".35"/><circle r="48" fill="url(#gold)" stroke="#fff4a6" stroke-width="5"/><use href="#eyes" transform="scale(.85)"/></g>
