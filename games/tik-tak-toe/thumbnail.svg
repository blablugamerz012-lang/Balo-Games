<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%`" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="orangeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Board Grid Gradient -->
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A86FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4EA8DE" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="320" height="180" fill="url(#bgGradient)" />

  <!-- Subtle Background Particles/Stars -->
  <circle cx="40" cy="30" r="1" fill="#4EA8DE" opacity="0.5" />
  <circle cx="280" cy="40" r="1.5" fill="#FFB703" opacity="0.6" />
  <circle cx="290" cy="140" r="1" fill="#4EA8DE" opacity="0.4" />
  <circle cx="30" cy="150" r="1.5" fill="#FFB703" opacity="0.5" />

  <!-- Title -->
  <text x="160" y="24" font-family="&#39;Segoe UI&#39;, Roboto, Helvetica, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">TIC TAC TOE <tspan fill="#4EA8DE">ONLINE!</tspan></text>

  <!-- Central Game Board Container -->
  <g transform="translate(95, 36)">
    <!-- Board Outline / Frame -->
    <rect x="0" y="0" width="130" height="130" rx="12" fill="#0B132B" stroke="#3A86FF" stroke-width="2" stroke-opacity="0.5" />

    <!-- Grid Lines -->
    <!-- Vertical Lines -->
    <line x1="43.3" y1="12" x2="43.3" y2="118" stroke="url(#gridGrad)" stroke-width="3" stroke-linecap="round" />
    <line x1="86.6" y1="12" x2="86.6" y2="118" stroke="url(#gridGrad)" stroke-width="3" stroke-linecap="round" />
    <!-- Horizontal Lines -->
    <line x1="12" y1="43.3" x2="118" y2="43.3" stroke="url(#gridGrad)" stroke-width="3" stroke-linecap="round" />
    <line x1="12" y1="86.6" x2="118" y2="86.6" stroke="url(#gridGrad)" stroke-width="3" stroke-linecap="round" />

    <!-- X Symbol (Top-Left: Row 0, Col 0) -->
    <g transform="translate(21, 21)" filter="url(#cyanGlow)">
      <line x1="3" y1="3" x2="15" y2="15" stroke="#4EA8DE" stroke-width="3.5" stroke-linecap="round" />
      <line x1="15" y1="3" x2="3" y2="15" stroke="#4EA8DE" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- O Symbol (Top-Middle: Row 0, Col 1) -->
    <g transform="translate(65, 21)" filter="url(#orangeGlow)">
      <circle cx="9" cy="9" r="7" fill="none" stroke="#FFB703" stroke-width="3.5" />
    </g>

    <!-- X Symbol (Top-Right: Row 0, Col 2) -->
    <g transform="translate(109, 21)" filter="url(#cyanGlow)">
      <line x1="3" y1="3" x2="15" y2="15" stroke="#4EA8DE" stroke-width="3.5" stroke-linecap="round" />
      <line x1="15" y1="3" x2="3" y2="15" stroke="#4EA8DE" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- O Symbol (Center-Left: Row 1, Col 0) -->
    <g transform="translate(21, 65)" filter="url(#orangeGlow)">
      <circle cx="9" cy="9" r="7" fill="none" stroke="#FFB703" stroke-width="3.5" />
    </g>

    <!-- X Symbol (Center: Row 1, Col 1) -->
    <g transform="translate(65, 65)" filter="url(#cyanGlow)">
      <line x1="3" y1="3" x2="15" y2="15" stroke="#4EA8DE" stroke-width="3.5" stroke-linecap="round" />
      <line x1="15" y1="3" x2="3" y2="15" stroke="#4EA8DE" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- O Symbol (Center-Right: Row 1, Col 2) -->
    <g transform="translate(109, 65)" filter="url(#orangeGlow)">
      <circle cx="9" cy="9" r="7" fill="none" stroke="#FFB703" stroke-width="3.5" />
    </g>

    <!-- X Symbol (Bottom-Left: Row 2, Col 0) -->
    <g transform="translate(21, 109)" filter="url(#cyanGlow)">
      <line x1="3" y1="3" x2="15" y2="15" stroke="#4EA8DE" stroke-width="3.5" stroke-linecap="round" />
      <line x1="15" y1="3" x2="3" y2="15" stroke="#4EA8DE" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- O Symbol (Bottom-Middle: Row 2, Col 1) -->
    <g transform="translate(65, 109)" filter="url(#orangeGlow)">
      <circle cx="9" cy="9" r="7" fill="none" stroke="#FFB703" stroke-width="3.5" />
    </g>

    <!-- X Symbol & Winning Strike (Bottom-Right: Row 2, Col 2) -->
    <g transform="translate(109, 109)" filter="url(#cyanGlow)">
      <line x1="3" y1="3" x2="15" y2="15" stroke="#4EA8DE" stroke-width="3.5" stroke-linecap="round" />
      <line x1="15" y1="3" x2="3" y2="15" stroke="#4EA8DE" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- Winning Diagonal Slash Overlay matching game UI -->
    <line x1="10" y1="10" x2="120" y2="120" stroke="#4EA8DE" stroke-width="4" stroke-linecap="round" filter="url(#cyanGlow)" opacity="0.9" />
  </g>

  <!-- UI Indicator Badges (Matching Balo Games Style) -->
  <!-- Left Status Badge -->
  <g transform="translate(12, 148)">
    <rect width="90" height="22" rx="6" fill="#1C2541" stroke="#3A86FF" stroke-width="1.5" />
    <text x="45" y="15" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="700" font-size="9" fill="#FFFFFF" text-anchor="middle">PLAYER 1 (X)</text>
  </g>

  <!-- Right Status Badge -->
  <g transform="translate(218, 148)">
    <rect width="90" height="22" rx="6" fill="#1C2541" stroke="#FFB703" stroke-width="1.5" />
    <text x="45" y="15" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="700" font-size="9" fill="#FFFFFF" text-anchor="middle">CPU (O)</text>
  </g>
</svg>