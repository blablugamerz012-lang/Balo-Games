<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Glow Filters -->
    <filter id="cyan-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="pink-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="blue-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="pink-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff75b5" />
      <stop offset="100%" stop-color="#ff1e56" />
    </linearGradient>

    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8f2ff" />
      <stop offset="100%" stop-color="#30e3df" />
    </linearGradient>

    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4da6ff" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="#0d0f1a" />

  <!-- Outer Neon Board Frame -->
  <rect x="40" y="40" width="420" height="420" rx="40" fill="#131526" stroke="url(#cyan-grad)" stroke-width="8" filter="url(#cyan-glow)" />

  <!-- Grid Lines -->
  <g stroke="url(#cyan-grad)" stroke-width="8" stroke-linecap="round" filter="url(#cyan-glow)">
    <!-- Vertical Lines -->
    <line x1="180" y1="65" x2="180" y2="435" />
    <line x1="320" y1="65" x2="320" y2="435" />
    <!-- Horizontal Lines -->
    <line x1="65" y1="180" x2="435" y2="180" />
    <line x1="65" y1="320" x2="435" y2="320" />
  </g>

  <!-- Top-Left X (Cyan) -->
  <g stroke="url(#cyan-grad)" stroke-width="22" stroke-linecap="round" filter="url(#cyan-glow)">
    <line x1="85" y1="100" x2="145" y2="160" />
    <line x1="145" y1="100" x2="85" y2="160" />
  </g>

  <!-- Top-Center O (Pink) -->
  <circle cx="250" cy="125" r="38" fill="none" stroke="url(#pink-grad)" stroke-width="20" filter="url(#pink-glow)" />

  <!-- Middle-Left O (Pink) -->
  <circle cx="110" cy="250" r="38" fill="none" stroke="url(#pink-grad)" stroke-width="20" filter="url(#pink-glow)" />

  <!-- Middle-Right O (Pink) -->
  <circle cx="390" cy="250" r="38" fill="none" stroke="url(#pink-grad)" stroke-width="20" filter="url(#pink-glow)" />

  <!-- Bottom-Center O (Pink) -->
  <circle cx="250" cy="375" r="38" fill="none" stroke="url(#pink-grad)" stroke-width="20" filter="url(#pink-glow)" />

  <!-- Bottom-Right X (Blue) -->
  <g stroke="url(#blue-grad)" stroke-width="22" stroke-linecap="round" filter="url(#blue-glow)">
    <line x1="355" y1="340" x2="415" y2="400" />
    <line x1="415" y1="340" x2="355" y2="400" />
  </g>
</svg>