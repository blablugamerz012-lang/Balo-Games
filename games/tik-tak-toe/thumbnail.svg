<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="400" height="420">
  <defs>
    <!-- Glow Filters -->
    <filter id="cyan-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="pink-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="blue-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="pink-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffc2d1" />
      <stop offset="100%" stop-color="#ff1e56" />
    </linearGradient>

    <linearGradient id="light-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d0f4ff" />
      <stop offset="100%" stop-color="#70e4ff" />
    </linearGradient>

    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3898ff" />
      <stop offset="100%" stop-color="#0055ff" />
    </linearGradient>
  </defs>

  <!-- Main Dark Board Background & Outer Border -->
  <rect x="15" y="15" width="370" height="390" rx="35" fill="#15152b" stroke="#5ce1e6" stroke-width="6" filter="url(#cyan-glow)" />

  <!-- Grid Lines -->
  <g stroke="#5ce1e6" stroke-width="8" stroke-linecap="round" filter="url(#cyan-glow)">
    <!-- Vertical Lines -->
    <line x1="142" y1="35" x2="142" y2="385" />
    <line x1="258" y1="35" x2="258" y2="385" />
    <!-- Horizontal Lines -->
    <line x1="35" y1="145" x2="365" y2="145" />
    <line x1="35" y1="275" x2="365" y2="275" />
  </g>

  <!-- Top-Left X (Light Cyan) -->
  <g stroke="url(#light-cyan-grad)" stroke-width="20" stroke-linecap="round" filter="url(#cyan-glow)">
    <line x1="55" y1="55" x2="112" y2="112" />
    <line x1="112" y1="55" x2="55" y2="112" />
  </g>

  <!-- Top-Center O (Pink) -->
  <circle cx="200" cy="85" r="33" fill="none" stroke="url(#pink-grad)" stroke-width="19" filter="url(#pink-glow)" />

  <!-- Middle-Left O (Pink) -->
  <circle cx="83" cy="210" r="33" fill="none" stroke="url(#pink-grad)" stroke-width="19" filter="url(#pink-glow)" />

  <!-- Middle-Right O (Pink) -->
  <circle cx="317" cy="210" r="33" fill="none" stroke="url(#pink-grad)" stroke-width="19" filter="url(#pink-glow)" />

  <!-- Bottom-Center O (Pink) -->
  <circle cx="200" cy="335" r="33" fill="none" stroke="url(#pink-grad)" stroke-width="19" filter="url(#pink-glow)" />

  <!-- Bottom-Right X (Deep Blue) -->
  <g stroke="url(#blue-grad)" stroke-width="20" stroke-linecap="round" filter="url(#blue-glow)">
    <line x1="288" y1="305" x2="345" y2="362" />
    <line x1="345" y1="305" x2="288" y2="362" />
  </g>
</svg>