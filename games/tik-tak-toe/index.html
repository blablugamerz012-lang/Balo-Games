<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Tic Tac Toe - Balo Games</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;overflow:hidden}body{background:linear-gradient(135deg,#061b55,#0875e8);color:#fff}.hidden{display:none!important}
.home{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(135deg,#061b55,#0875e8 55%,#0a4a9e);overflow:auto}.hero{width:min(94vw,980px);text-align:center}.hero img{display:block;width:100%;height:auto;border-radius:26px;box-shadow:0 18px 50px rgba(0,0,0,.45);border:3px solid rgba(255,255,255,.45)}.hero-play{margin-top:-34px;position:relative;z-index:2;border:0;border-radius:18px;padding:15px 58px;font-size:clamp(21px,4vw,30px);font-weight:900;letter-spacing:1px;color:#fff;background:linear-gradient(135deg,#12c75a,#1a9e4a);box-shadow:0 7px 0 #0d6b32,0 12px 28px rgba(0,0,0,.35);cursor:pointer}.hero-play:hover{transform:translateY(-2px);filter:brightness(1.08)}.hero-play:active{transform:translateY(3px);box-shadow:0 3px 0 #0d6b32}
.game{width:min(94vw,520px);height:100%;margin:auto;display:flex;flex-direction:column;justify-content:center;text-align:center;position:relative}.title{font-size:clamp(30px,7vw,50px);font-weight:900;text-shadow:0 4px 0 #003477;margin:0 0 2px}.status{font-size:clamp(17px,4vw,25px);font-weight:800;margin:2px 0 7px;min-height:28px}.board-wrap{position:relative;width:min(85vw,420px);aspect-ratio:1;margin:auto;background:rgba(0,0,0,.16);border-radius:26px;padding:10px;box-shadow:0 12px 32px rgba(0,0,0,.35)}.board-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:26px}.grid{position:absolute;inset:15%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:2.8%;z-index:2}.cell{border:0;background:rgba(0,40,120,.08);border-radius:12px;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;padding:0}.cell:hover{background:rgba(255,255,255,.08)}.cell img{width:82%;height:82%;object-fit:contain;pointer-events:none}.score{display:flex;justify-content:center;gap:10px;margin-top:7px;font-weight:800;flex-wrap:wrap;font-size:14px}.score span{background:rgba(0,0,0,.2);padding:5px 11px;border-radius:8px}.result{font-size:clamp(20px,5vw,30px);font-weight:900;min-height:32px;margin-top:5px}.replay{margin-top:6px;border:0;border-radius:15px;padding:12px 38px;font-size:20px;font-weight:900;color:#fff;background:linear-gradient(135deg,#12c75a,#1a9e4a);box-shadow:0 5px 0 #0d6b32;cursor:pointer}.corner-home{position:fixed;top:14px;left:14px;z-index:15;border:0;border-radius:12px;padding:10px 14px;font-size:15px;font-weight:800;cursor:pointer;color:#fff;background:rgba(0,0,0,.38);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.2)}
.overlay{position:fixed;inset:0;background:rgba(3,16,60,.92);display:flex;align-items:center;justify-content:center;z-index:30;padding:20px}.box{position:relative;width:min(92vw,440px);text-align:center;background:linear-gradient(145deg,#0b398d,#075bc4);padding:28px 20px;border-radius:26px;box-shadow:0 20px 60px rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.16)}.box-close{position:absolute;top:8px;right:8px;width:42px;height:42px;border:0;border-radius:50%;background:#e02440;color:#fff;font-size:24px;font-weight:900;cursor:pointer}.box-title{font-size:clamp(24px,6vw,38px);font-weight:900;margin:0 0 6px;padding-right:24px}.box-sub{font-size:15px;font-weight:700;margin:0 0 18px;opacity:.95}.diff-row{display:flex;flex-direction:column;gap:10px}.diff-btn{border:0;border-radius:14px;padding:14px 18px;font-size:18px;font-weight:800;cursor:pointer;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25);text-align:left;display:flex;align-items:center;justify-content:space-between}.diff-easy{background:linear-gradient(135deg,#1a9e4a,#12c75a)}.diff-normal{background:linear-gradient(135deg,#c47a0a,#e8a020)}.diff-hard{background:linear-gradient(135deg,#b01a2e,#e02440)}.diff-desc{font-size:12px;font-weight:600;opacity:.9}.choice-row{display:flex;justify-content:center;gap:16px}.choice{width:120px;height:120px;border:0;border-radius:20px;background:rgba(255,255,255,.12);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 7px 0 rgba(0,0,0,.2)}.choice img{width:88%;height:88%;object-fit:contain}
@media(max-height:700px){.hero{width:min(90vw,760px)}.hero-play{margin-top:-26px;padding:11px 44px}.title{font-size:30px}.board-wrap{width:min(68vh,360px)}.result{font-size:18px;min-height:26px}}
</style>
</head>
<body>
<div class="home" id="homeScreen"><div class="hero"><img src="balo-games-banner.svg" alt="Tic Tac Toe Balo Games"><button class="hero-play" onclick="goToDiff()">▶ PLAY</button></div></div>
<button class="corner-home hidden" id="cornerHome" onclick="goHome()">🏠 Home</button>
<div class="game hidden" id="gameScreen"><h1 class="title">TIC TAC TOE</h1><div class="status" id="status"></div><div class="board-wrap"><img class="board-bg" src="board.png" alt="Board"><div class="grid" id="grid"></div></div><div class="result" id="result"></div><button class="replay hidden" id="replay" onclick="newRound()">▶ PLAY AGAIN</button><div class="score"><span>X: <b id="xScore">0</b></span><span>O: <b id="oScore">0</b></span><span>Draw: <b id="dScore">0</b></span></div></div>
<div class="overlay hidden" id="diffScreen"><div class="box"><button class="box-close" onclick="goHome()">✕</button><div class="box-title">SELECT DIFFICULTY</div><div class="box-sub">Choose how hard the Bot plays</div><div class="diff-row"><button class="diff-btn diff-easy" onclick="selectDiff('easy')"><span>😊 EASY</span><span class="diff-desc">Bot makes mistakes</span></button><button class="diff-btn diff-normal" onclick="selectDiff('normal')"><span>😐 NORMAL</span><span class="diff-desc">Balanced challenge</span></button><button class="diff-btn diff-hard" onclick="selectDiff('hard')"><span>🔥 HARD</span><span class="diff-desc">Almost unbeatable</span></button></div></div></div>
<div class="overlay hidden" id="choose"><div class="box"><button class="box-close" onclick="goHome()">✕</button><div class="box-title">CHOOSE YOUR SYMBOL</div><div class="box-sub">Choose X or O — the other will be the Bot</div><div class="choice-row"><button class="choice" onclick="chooseSymbol('X')"><img src="x.png" alt="X"></button><button class="choice" onclick="chooseSymbol('O')"><img src="o.png" alt="O"></button></div></div></div>
<script>
const $=id=>document.getElementById(id);const grid=$('grid'),statusEl=$('status'),resultEl=$('result'),home=$('homeScreen'),game=$('gameScreen'),diff=$('diffScreen'),choose=$('choose'),corner=$('cornerHome'),replay=$('replay');let board=Array(9).fill(''),human='X',bot='O',turn='X',difficulty='normal',scores={X:0,O:0,D:0},locked=false;
function show(el){el.classList.remove('hidden')}function hide(el){el.classList.add('hidden')}
function goToDiff(){hide(home);show(diff)}function goHome(){hide(diff);hide(choose);hide(game);show(home);corner.classList.add('hidden');resetBoard()}
function selectDiff(d){difficulty=d;hide(diff);show(choose)}
function chooseSymbol(s){human=s;bot=s==='X'?'O':'X';hide(choose);show(game);corner.classList.remove('hidden');newRound()}
function resetBoard(){board=Array(9).fill('');turn='X';locked=false;render();statusEl.textContent='';resultEl.textContent='';hide(replay)}
function newRound(){resetBoard();statusEl.textContent=turn===human?'Your turn':'Bot thinking...';if(turn===bot)setTimeout(botMove,450)}
function render(){grid.innerHTML='';board.forEach((v,i)=>{const b=document.createElement('button');b.className='cell';b.setAttribute('aria-label','Cell '+(i+1));if(v){const im=document.createElement('img');im.src=v==='X'?'x.png':'o.png';im.alt=v;b.appendChild(im)}b.addEventListener('click',()=>playerMove(i));grid.appendChild(b)})}
function playerMove(i){if(locked||turn!==human||board[i])return;move(i,human);if(!locked)setTimeout(botMove,350)}
function move(i,s){if(board[i])return;board[i]=s;render();const w=winner();if(w){end(w);return}if(board.every(Boolean)){end('D');return}turn=s==='X'?'O':'X';statusEl.textContent=turn===human?'Your turn':'Bot thinking...'}
function winner(){const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];for(const [a,b,c]of lines)if(board[a]&&board[a]===board[b]&&board[a]===board[c])return board[a];return null}
function end(w){locked=true;if(w==='D'){scores.D++;resultEl.textContent="It's a Draw!"}else{scores[w]++;resultEl.textContent=(w===human?'You Win!':'Bot Wins!')}$('xScore').textContent=scores.X;$('oScore').textContent=scores.O;$('dScore').textContent=scores.D;statusEl.textContent='Round over';show(replay)}
function botMove(){if(locked||turn!==bot)return;const i=pickMove();move(i,bot)}
function pickMove(){let empty=board.map((v,i)=>v?null:i).filter(v=>v!==null);if(difficulty==='easy')return empty[Math.floor(Math.random()*empty.length)];if(difficulty==='normal'&&Math.random()<.35)return empty[Math.floor(Math.random()*empty.length)];let best=-Infinity,bestI=empty[0];for(const i of empty){board[i]=bot;const sc=minimax(false);board[i]='';if(sc>best){best=sc;bestI=i}}return bestI}
function minimax(maximizing){const w=winner();if(w===bot)return 10;if(w===human)return -10;if(board.every(Boolean))return 0;const empty=board.map((v,i)=>v?null:i).filter(v=>v!==null);if(maximizing){let best=-Infinity;for(const i of empty){board[i]=bot;best=Math.max(best,minimax(false));board[i]=''}return best}else{let best=Infinity;for(const i of empty){board[i]=human;best=Math.min(best,minimax(true));board[i]=''}return best}}
resetBoard();
</script>
</body>
</html>
