<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EVO-GAMES HUB | Free Online Games</title>
  <meta name="description" content="Discover EVO-GAMES HUB, your destination for free online games. Explore action, adventure, and arcade games and start playing.">

  <!-- FAVICON -->
  <link rel="icon" type="image/png" sizes="512x512" href="./icon/icon.png?v=3">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon/icon.png?v=3">
  <link rel="icon" type="image/png" sizes="32x32" href="./icon/icon.png?v=3">
  <link rel="icon" type="image/png" sizes="16x16" href="./icon/icon.png?v=3">
  <link rel="shortcut icon" href="./icon/icon.png?v=3">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header>
    <button class="logo" id="logoBtn" aria-label="Home">
      <img src="./logo.png" alt="EVO-GAMES HUB">
    </button>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="./">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="privacy-policy.html">Privacy Policy</a>
    </nav>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h1>Play Free Online Games</h1>
    <p>Discover and play games instantly.</p>
  </section>

  <!-- CATEGORIES -->
  <div class="categories">
    <button class="category" onclick="filterGames('all')">🎮 All Games</button>
    <button class="category" onclick="filterGames('action')">⚡ Action</button>
    <button class="category" onclick="filterGames('adventure')">🗺️ Adventure</button>
    <button class="category" onclick="filterGames('arcade')">🕹️ Arcade</button>
  </div>

  <!-- GAMES -->
  <main class="games-section">
    <h2>🔥 Popular Games</h2>
    <div class="game-grid" id="gameGrid"></div>
  </main>

  <!-- FOOTER -->
  <footer>
    © 2026 EVO-GAMES HUB
    <nav aria-label="Footer navigation">
      <a href="about.html">About</a> ·
      <a href="contact.html">Contact</a> ·
      <a href="privacy-policy.html">Privacy Policy</a>
    </nav>
  </footer>

  <!-- GAME OVERLAY -->
  <div id="gameOverlay">
    <button id="gameCloseBtn" aria-label="Close Game">✕</button>
    <iframe id="gameFrame" src="" title="Game" allowfullscreen></iframe>
  </div>

  <!-- QUIT CONFIRM MODAL -->
  <div id="confirmBackdrop">
    <div class="confirm-box">
      <button class="confirm-close" id="confirmCloseBtn" aria-label="Close">✕</button>
      <p>Do you want to quit the game and go to the home page?</p>
      <div class="confirm-actions">
        <button class="btn-yes" id="confirmYesBtn">YES</button>
        <button class="btn-no" id="confirmNoBtn">NO</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
