<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Balo Games</title>

<meta name="description" content="Balo Games is a browser gaming website where players can discover and play games.">
<meta name="keywords" content="Balo Games, online games, action games, adventure games, arcade games">
<meta name="robots" content="index, follow">

<link rel="canonical" href="https://blablugamerz012-lang.github.io/Balo-Games/">

<meta property="og:title" content="Balo Games">
<meta property="og:description" content="Discover and play browser games on Balo Games.">
<meta property="og:url" content="https://blablugamerz012-lang.github.io/Balo-Games/">
<meta property="og:type" content="website">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#071a48;
    color:#fff;
}

body{
    overflow-x:hidden;
}

button{
    font-family:inherit;
}

.hidden{
    display:none!important;
}

/* ================= HEADER ================= */

.header{
    min-height:82px;
    padding:12px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    background:linear-gradient(90deg,#4f454a,#ff1ac2);
    box-shadow:0 4px 15px rgba(0,0,0,.25);
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    color:#fff;
    font-size:30px;
    font-weight:900;
    text-decoration:none;
    white-space:nowrap;
}

.logo-icon{
    width:48px;
    height:48px;
    border-radius:14px;
    background:#fff;
    color:#ff1493;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:900;
    box-shadow:0 4px 10px rgba(0,0,0,.2);
}

.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.search-box{
    width:230px;
    height:44px;
    border:0;
    outline:none;
    border-radius:25px;
    padding:0 18px;
    font-size:15px;
    background:#fff;
    color:#222;
}

.login-btn{
    border:0;
    background:#087cff;
    color:#fff;
    padding:12px 20px;
    border-radius:24px;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,.25);
}

.login-btn:hover{
    transform:translateY(-1px);
    background:#006be5;
}

/* ================= HERO ================= */

.hero{
    min-height:245px;
    padding:35px 20px;
    background:linear-gradient(135deg,#0712ab,#0754c9);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.hero-content{
    max-width:850px;
}

.hero h1{
    font-size:52px;
    font-weight:900;
    margin-bottom:10px;
}

.hero p{
    font-size:18px;
    opacity:.95;
    margin-bottom:22px;
}

.hero-search{
    width:min(600px,90vw);
    height:52px;
    border:0;
    outline:0;
    border-radius:28px;
    padding:0 22px;
    font-size:17px;
    color:#222;
}

/* ================= CATEGORIES ================= */

.category-area{
    background:#43addb;
    padding:18px 15px;
}

.categories{
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
}

.category-btn{
    border:0;
    padding:11px 23px;
    border-radius:25px;
    background:#0754c9;
    color:#fff;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    transition:.2s;
}

.category-btn:hover,
.category-btn.active{
    background:#ff1493;
    transform:translateY(-2px);
}

/* ================= GAMES ================= */

.games-area{
    background:#43addb;
    padding:15px 18px 45px;
    min-height:450px;
}

.section-title{
    max-width:1200px;
    margin:0 auto 20px;
    font-size:31px;
    font-weight:900;
}

.game-grid{
    max-width:1200px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
}

.game-card{
    min-height:170px;
    border-radius:22px;
    overflow:hidden;
    background:linear-gradient(145deg,#bababa,#4f899c);
    border:4px solid rgba(255,255,255,.75);
    box-shadow:0 8px 18px rgba(0,0,0,.25);
    cursor:pointer;
    transition:.2s;
    display:flex;
    flex-direction:column;
}

.game-card:hover{
    transform:translateY(-5px);
    box-shadow:0 13px 25px rgba(0,0,0,.3);
}

.game-thumb{
    flex:1;
    min-height:105px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,.15);
    font-size:55px;
}

.game-info{
    background:rgba(0,0,0,.55);
    padding:11px 13px;
}

.game-title{
    font-size:18px;
    font-weight:900;
    margin-bottom:4px;
}

.game-desc{
    font-size:12px;
    opacity:.9;
}

/* ================= EMPTY ================= */

.empty{
    text-align:center;
    padding:55px 15px;
    color:#fff;
    font-size:18px;
}

/* ================= GAME VIEW ================= */

.game-screen{
    display:none;
    min-height:calc(100vh - 82px);
    background:#071a48;
}

.game-screen.active{
    display:block;
}

.game-topbar{
    min-height:65px;
    padding:10px 15px;
    background:#0754c9;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.back-btn{
    border:0;
    background:#ff1493;
    color:#fff;
    border-radius:22px;
    padding:11px 19px;
    font-weight:900;
    cursor:pointer;
}

.game-name{
    font-size:22px;
    font-weight:900;
    text-align:center;
}

.game-container{
    width:100%;
    height:calc(100vh - 147px);
    min-height:500px;
    background:#000;
}

#gameFrame{
    display:block;
    width:100%;
    height:100%;
    border:0;
    background:#000;
}

/* ================= FOOTER ================= */

.footer{
    background:#071a48;
    padding:30px 15px;
    text-align:center;
}

.footer-logo{
    font-size:25px;
    font-weight:900;
    color:#ff1ac2;
    margin-bottom:8px;
}

.footer p{
    font-size:13px;
    opacity:.75;
}

/* ================= RESPONSIVE ================= */

@media(max-width:900px){

    .game-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .hero h1{
        font-size:42px;
    }

    .search-box{
        width:180px;
    }
}

@media(max-width:650px){

    .header{
        min-height:auto;
        padding:10px 12px;
        flex-wrap:wrap;
    }

    .logo{
        font-size:23px;
    }

    .logo-icon{
        width:40px;
        height:40px;
    }

    .header-right{
        width:100%;
        justify-content:center;
    }

    .search-box{
        flex:1;
        min-width:0;
        width:auto;
    }

    .login-btn{
        padding:11px 15px;
    }

    .hero{
        min-height:210px;
    }

    .hero h1{
        font-size:35px;
    }

    .hero p{
        font-size:15px;
    }

    .game-grid{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .game-card{
        min-height:155px;
    }

    .game-thumb{
        min-height:90px;
        font-size:45px;
    }

    .section-title{
        font-size:26px;
    }
}

@media(max-width:390px){

    .game-grid{
        grid-template-columns:1fr;
    }

    .category-btn{
        padding:10px 17px;
    }
}
</style>
</head>

<body>

<!-- ================= HOME ================= -->

<div id="homeScreenView">

<header class="header">

    <a href="#" class="logo" onclick="goHome();return false;">
        <span class="logo-icon">B</span>
        <span>Balo Games</span>
    </a>

    <div class="header-right">

        <input
            type="search"
            id="headerSearch"
            class="search-box"
            placeholder="Search games..."
            autocomplete="off"
        >

        <button class="login-btn" onclick="showComingSoon()">
            Login
        </button>

    </div>

</header>

<section class="hero">

    <div class="hero-content">

        <h1>Balo Games</h1>

        <p>
            Discover and play browser games on Balo Games.
        </p>

        <input
            type="search"
            id="heroSearch"
            class="hero-search"
            placeholder="Search your favorite game..."
            autocomplete="off"
        >

    </div>

</section>

<section class="category-area">

    <div class="categories">

        <button
            class="category-btn active"
            data-category="all"
            onclick="filterCategory('all',this)">
            All Games
        </button>

        <button
            class="category-btn"
            data-category="action"
            onclick="filterCategory('action',this)">
            Action
        </button>

        <button
            class="category-btn"
            data-category="adventure"
            onclick="filterCategory('adventure',this)">
            Adventure
        </button>

        <button
            class="category-btn"
            data-category="arcade"
            onclick="filterCategory('arcade',this)">
            Arcade
        </button>

    </div>

</section>

<section class="games-area">

    <h2 class="section-title" id="sectionTitle">
        All Games
    </h2>

    <div class="game-grid" id="homeGrid"></div>

    <div class="empty hidden" id="emptyMessage">
        No games found.
    </div>

</section>

<footer class="footer">

    <div class="footer-logo">Balo Games</div>

    <p>
        Discover and play browser games.
    </p>

</footer>

</div>


<!-- ================= GAME SCREEN ================= -->

<div id="gameScreenView" class="game-screen">

    <div class="game-topbar">

        <button class="back-btn" onclick="goHome()">
            ← Back
        </button>

        <div class="game-name" id="overlayGameTitle">
            Balo Games
        </div>

        <button class="back-btn" onclick="goHome()">
            Home
        </button>

    </div>

    <div class="game-container">

        <iframe
            id="gameFrame"
            title="Balo Games"
            allowfullscreen
            loading="eager">
        </iframe>

    </div>

</div>


<script>

/* =========================================================
   BALO GAMES
   GAME REGISTRY
   ========================================================= */

const games = [

    {
        title:"Evo Eater",
        cat:"action",
        tags:["action"],
        icon:"🦅",
        desc:"Grow, evolve, and explore.",
        path:"games/evo-eater/index.html"
    },

    {
        title:"Tik Tak Toe",
        cat:"arcade",
        tags:["arcade"],
        icon:"❌⭕",
        desc:"Classic strategy game.",
        path:"games/tik-tak-toe/index.html"
    },

    {
        title:"Memory Match",
        cat:"arcade",
        tags:["arcade"],
        icon:"🧠",
        desc:"Test your memory.",
        path:"games/memory-match/index.html"
    },

    {
        title:"Snake King",
        cat:"arcade",
        tags:["arcade","snake"],
        icon:"🐍",
        desc:"Classic snake action.",
        path:"games/snake-king/index.html"
    },

    {
        title:"Space Run",
        cat:"action",
        tags:["action"],
        icon:"🚀",
        desc:"Space runner.",
        path:"games/space-run/index.html"
    },

    {
        title:"Puzzle Box",
        cat:"adventure",
        tags:["adventure","puzzle"],
        icon:"🧩",
        desc:"Solve puzzles.",
        path:"games/puzzle-box/index.html"
    },

    {
        title:"Dungeon Quest",
        cat:"adventure",
        tags:["adventure"],
        icon:"⚔️",
        desc:"Explore dungeons.",
        path:"games/dungeon-quest/index.html"
    }

];


/* =========================================================
   VARIABLES
   ========================================================= */

let currentCategory = "all";
let currentSearch = "";


/* =========================================================
   CREATE GAME CARD
   ========================================================= */

function createGameCard(game){

    const card = document.createElement("div");

    card.className = "game-card";

    card.setAttribute("tabindex","0");

    card.innerHTML = `

        <div class="game-thumb">
            ${game.icon}
        </div>

        <div class="game-info">

            <div class="game-title">
                ${escapeHTML(game.title)}
            </div>

            <div class="game-desc">
                ${escapeHTML(game.desc)}
            </div>

        </div>

    `;

    card.addEventListener("click",function(){
        openGame(game.title);
    });

    card.addEventListener("keydown",function(e){

        if(e.key === "Enter" || e.key === " "){
            e.preventDefault();
            openGame(game.title);
        }

    });

    return card;
}


/* =========================================================
   RENDER GAMES
   ========================================================= */

function renderGames(){

    const grid = document.getElementById("homeGrid");
    const empty = document.getElementById("emptyMessage");

    grid.innerHTML = "";

    const search = currentSearch.trim().toLowerCase();

    const filtered = games.filter(function(game){

        const categoryMatch =
            currentCategory === "all" ||
            game.cat === currentCategory ||
            game.tags.includes(currentCategory);

        const searchMatch =
            !search ||
            game.title.toLowerCase().includes(search) ||
            game.desc.toLowerCase().includes(search) ||
            game.tags.some(tag =>
                tag.toLowerCase().includes(search)
            );

        return categoryMatch && searchMatch;

    });

    filtered.forEach(function(game){

        grid.appendChild(
            createGameCard(game)
        );

    });

    empty.classList.toggle(
        "hidden",
        filtered.length !== 0
    );

}


/* =========================================================
   CATEGORY FILTER
   ========================================================= */

function filterCategory(category,button){

    currentCategory = category;

    document
        .querySelectorAll(".category-btn")
        .forEach(function(btn){
            btn.classList.remove("active");
        });

    if(button){
        button.classList.add("active");
    }

    const names = {
        all:"All Games",
        action:"Action",
        adventure:"Adventure",
        arcade:"Arcade"
    };

    document.getElementById("sectionTitle").textContent =
        names[category] || "All Games";

    renderGames();

    window.scrollTo({
        top:document.querySelector(".games-area").offsetTop - 70,
        behavior:"smooth"
    });

}


/* =========================================================
   SEARCH
   ========================================================= */

function performSearch(value){

    currentSearch = value;

    renderGames();

}


document
    .getElementById("headerSearch")
    .addEventListener("input",function(){

        document.getElementById("heroSearch").value =
            this.value;

        performSearch(this.value);

    });


document
    .getElementById("heroSearch")
    .addEventListener("input",function(){

        document.getElementById("headerSearch").value =
            this.value;

        performSearch(this.value);

    });


/* =========================================================
   OPEN GAME
   ========================================================= */

function openGame(title){

    const game = games.find(function(g){
        return g.title === title;
    });

    if(!game || !game.path){
        alert("Game is not available yet.");
        return;
    }

    const frame = document.getElementById("gameFrame");

    document.getElementById("overlayGameTitle").textContent =
        game.title;

    frame.src = game.path;

    document
        .getElementById("homeScreenView")
        .classList.add("hidden");

    document
        .getElementById("gameScreenView")
        .classList.add("active");

    window.scrollTo(0,0);

}


/* =========================================================
   HOME
   ========================================================= */

function goHome(){

    const frame = document.getElementById("gameFrame");

    frame.src = "about:blank";

    document
        .getElementById("gameScreenView")
        .classList.remove("active");

    document
        .getElementById("homeScreenView")
        .classList.remove("hidden");

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================================
   LOGIN
   ========================================================= */

function showComingSoon(){

    alert("Login feature is coming soon.");

}


/* =========================================================
   SAFE HTML
   ========================================================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   IFRAME ERROR
   ========================================================= */

document
    .getElementById("gameFrame")
    .addEventListener("error",function(){

        document.getElementById("overlayGameTitle").textContent =
            "Game could not be loaded";

    });


/* =========================================================
   START
   ========================================================= */

renderGames();

</script>

</body>
</html>
